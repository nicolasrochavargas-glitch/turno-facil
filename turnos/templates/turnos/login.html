<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Turno Fácil | Acceso de empleados</title>

    <style>

        :root {
            --verde: #6FAF7B;
            --verde-oscuro: #4F8F5C;
            --verde-claro: #EAF6EC;
            --fondo: #F7FBF7;
            --texto: #26352A;
            --gris: #68756B;
            --blanco: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: var(--verde-claro);
            color: var(--texto);
            overflow-x: hidden;
            position: relative;
        }

        /* ONDAS DECORATIVAS */

        .onda {
            position: fixed;
            width: 120%;
            height: 300px;
            left: -10%;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .onda-1 {
            top: -170px;
            background: #DCEEDF;
            transform: rotate(-5deg);
        }

        .onda-2 {
            bottom: -190px;
            background: #C9E4CE;
            transform: rotate(4deg);
        }

        .onda-3 {
            bottom: -240px;
            background: #B8DABF;
            transform: rotate(-3deg);
        }

        .contenedor {
            width: 95%;
            max-width: 450px;
            margin: 45px auto;
            position: relative;
            z-index: 1;
        }

        /* LOGIN */

        .login {
            background: white;
            padding: 38px;
            border-radius: 22px;
            border: 1px solid #DCEEDF;
            box-shadow: 0 10px 35px rgba(79, 143, 92, 0.12);
        }

        /* LOGO */

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--verde-claro);
            border-radius: 50%;
            font-size: 40px;
        }

        h1 {
            text-align: center;
            color: var(--verde-oscuro);
            margin: 0 0 10px;
            font-size: 28px;
        }

        .marca {
            text-align: center;
            color: var(--verde);
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .descripcion {
            text-align: center;
            color: var(--gris);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* CAMPOS */

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #D4E3D7;
            border-radius: 10px;
            font-size: 16px;
            background: #FCFEFC;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--verde);
            box-shadow: 0 0 0 3px rgba(111, 175, 123, 0.15);
        }

        /* BOTÓN */

        button {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            background: var(--verde);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: var(--verde-oscuro);
            transform: translateY(-2px);
        }

        /* ERROR */

        .error {
            background: #FEF2F2;
            color: #B91C1C;
            border: 1px solid #FECACA;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 22px;
            text-align: center;
            font-weight: bold;
        }

        /* VOLVER */

        .volver {
            display: block;
            text-align: center;
            margin-top: 22px;
            padding: 10px;
            color: var(--verde-oscuro);
            text-decoration: none;
            font-weight: bold;
        }

        .volver:hover {
            color: #3E754A;
            text-decoration: underline;
        }

        /* CELULAR */

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .contenedor {
                width: 95%;
                margin: 20px auto;
            }

            .login {
                padding: 30px 20px;
                border-radius: 18px;
            }

            .logo {
                width: 65px;
                height: 65px;
                font-size: 34px;
            }

            h1 {
                font-size: 25px;
            }

            .descripcion {
                font-size: 15px;
                margin-bottom: 25px;
            }

            input {
                padding: 14px;
                font-size: 16px;
            }

            button {
                padding: 16px;
                font-size: 17px;
            }

        }

    </style>

</head>

<body>

    <!-- ONDAS -->

    <div class="onda onda-1"></div>
    <div class="onda onda-2"></div>
    <div class="onda onda-3"></div>


    <div class="contenedor">

        <div class="login">

            <div class="logo">
                🔐
            </div>

            <div class="marca">
                🎫 Turno Fácil
            </div>

            <h1>
                Acceso de empleados
            </h1>

            <p class="descripcion">
                Ingresa tus credenciales para acceder al panel.
            </p>


            {% if form.errors %}

                <div class="error">
                    ⚠️ Usuario o contraseña incorrectos.
                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="campo">

                    <label for="id_username">
                        Usuario
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="id_password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button type="submit">
                    🔐 Iniciar sesión
                </button>

            </form>


            <a class="volver" href="{% url 'inicio' %}">
                ← Volver al inicio
            </a>

        </div>

    </div>

</body>

</html>
