<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Turno Fácil | Acceso de empleados</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0fdf4;
            color: #1f2937;
        }

        .contenedor {
            width: 100%;
            max-width: 450px;
            margin: 45px auto;
        }

        /* LOGIN */

        .login {
            background: white;
            padding: 38px;
            border-radius: 22px;
            border: 1px solid #dcfce7;
            box-shadow: 0 10px 35px rgba(22, 163, 74, 0.08);
        }

        /* LOGO */

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #dcfce7;
            border-radius: 50%;
            font-size: 40px;
        }

        h1 {
            text-align: center;
            color: #166534;
            margin: 0 0 10px;
            font-size: 28px;
        }

        .marca {
            text-align: center;
            color: #16a34a;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .descripcion {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* CAMPOS */

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
        }

        /* BOTÓN */

        button {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }

        /* ERROR */

        .error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 22px;
            text-align: center;
            font-weight: bold;
        }

        /* VOLVER */

        .volver {
            display: block;
            text-align: center;
            margin-top: 22px;
            padding: 10px;
            color: #166534;
            text-decoration: none;
            font-weight: bold;
        }

        .volver:hover {
            color: #15803d;
            text-decoration: underline;
        }

        /* CELULAR */

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .contenedor {
                margin: 20px auto;
            }

            .login {
                padding: 30px 20px;
                border-radius: 18px;
            }

            .logo {
                width: 65px;
                height: 65px;
                font-size: 34px;
            }

            h1 {
                font-size: 25px;
            }

            .descripcion {
                font-size: 15px;
                margin-bottom: 25px;
            }

            input {
                padding: 14px;
                font-size: 16px;
            }

            button {
                padding: 16px;
                font-size: 17px;
            }

        }

    </style>

</head>

<body>

    <div class="contenedor">

        <div class="login">

            <div class="logo">
                🔐
            </div>

            <div class="marca">
                🎫 Turno Fácil
            </div>

            <h1>
                Acceso de empleados
            </h1>

            <p class="descripcion">
                Ingresa tus credenciales para acceder al panel.
            </p>


            {% if form.errors %}

                <div class="error">
                    ⚠️ Usuario o contraseña incorrectos.
                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="campo">

                    <label for="id_username">
                        Usuario
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="id_password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button type="submit">
                    🔐 Iniciar sesión
                </button>

            </form>


            <a class="volver" href="{% url 'inicio' %}">
                ← Volver al inicio
            </a>

        </div>

    </div>

</body>

</html>
