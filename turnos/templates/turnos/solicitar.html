<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar turno - Turno Fácil</title>

    <style>
        :root {
            --verde: #6FAF7B;
            --verde-oscuro: #4F8F5C;
            --verde-claro: #EAF6EC;
            --fondo: #F7FBF7;
            --texto: #26352A;
            --gris: #68756B;
            --blanco: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--verde-claro);
            color: var(--texto);
            overflow-x: hidden;
            position: relative;
        }

        /* Ondas decorativas */
        .onda {
            position: fixed;
            width: 120%;
            height: 300px;
            left: -10%;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .onda-1 {
            top: -170px;
            background: #DCEEDF;
            transform: rotate(-5deg);
        }

        .onda-2 {
            bottom: -190px;
            background: #C9E4CE;
            transform: rotate(4deg);
        }

        .onda-3 {
            bottom: -240px;
            background: #B8DABF;
            transform: rotate(-3deg);
        }

        .contenedor {
            width: 95%;
            max-width: 900px;
            margin: 0 auto;
            padding: 45px 0;
            position: relative;
            z-index: 1;
        }

        .marca {
            text-align: center;
            margin-bottom: 25px;
        }

        .marca h1 {
            margin: 0;
            color: var(--verde-oscuro);
            font-size: 32px;
        }

        .marca p {
            margin: 8px 0 0;
            color: var(--gris);
            font-size: 15px;
        }

        .formulario {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            background: var(--blanco);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(79, 143, 92, 0.15);
        }

        .formulario h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--texto);
        }

        .descripcion {
            text-align: center;
            color: var(--gris);
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--texto);
        }

        .campo input,
        .campo textarea,
        .campo select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #D4E3D7;
            border-radius: 10px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            outline: none;
            background: #FCFEFC;
        }

        .campo input:focus,
        .campo textarea:focus,
        .campo select:focus {
            border-color: var(--verde);
            box-shadow: 0 0 0 3px rgba(111, 175, 123, 0.15);
        }

        .campo textarea {
            min-height: 110px;
            resize: vertical;
        }

        .boton {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: var(--verde);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton:hover {
            background: var(--verde-oscuro);
            transform: translateY(-1px);
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--verde-oscuro);
            text-decoration: none;
            font-weight: bold;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .contenedor {
                width: 95%;
                padding: 30px 0;
            }

            .formulario {
                padding: 25px 20px;
            }

            .marca h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="onda onda-1"></div>
    <div class="onda onda-2"></div>
    <div class="onda onda-3"></div>

    <div class="contenedor">

        <div class="marca">
            <h1>🎫 Turno Fácil</h1>
            <p>Solicita tu turno de manera rápida y sencilla</p>
        </div>

        <div class="formulario">

            <h2>🎫 Solicitar turno</h2>

            <p class="descripcion">
                Completa los siguientes datos para obtener tu turno.
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="campo">
                    <label for="cliente">Nombre del cliente</label>
                    <input
                        type="text"
                        id="cliente"
                        name="cliente"
                        placeholder="Ingresa tu nombre"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="fecha">Fecha</label>
                    <input
                        type="date"
                        id="fecha"
                        name="fecha"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="necesidad">¿Qué necesitas?</label>
                    <textarea
                        id="necesidad"
                        name="necesidad"
                        placeholder="Describe brevemente el motivo de tu visita"
                        required
                    ></textarea>
                </div>

                <button type="submit" class="boton">
                    🎫 Solicitar turno
                </button>
            </form>

            <a href="{% url 'inicio' %}" class="volver">
                ← Volver al inicio
            </a>

        </div>
    </div>

</body>
</html>
