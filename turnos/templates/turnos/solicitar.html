<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Turno Fácil | Solicitar turno</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 600px;
            margin: 30px auto;
        }

        .marca {
            text-align: center;
            margin-bottom: 20px;
        }

        .marca h1 {
            margin: 0;
            color: #1f2937;
            font-size: 34px;
        }

        .marca p {
            margin: 7px 0 0;
            color: #64748b;
            font-size: 15px;
        }

        .formulario {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .formulario h2 {
            text-align: center;
            color: #1f2937;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 27px;
        }

        .descripcion {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            background: white;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            padding: 10px;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .contenedor {
                margin: 15px auto;
            }

            .marca h1 {
                font-size: 30px;
            }

            .formulario {
                padding: 25px 18px;
                border-radius: 10px;
            }

            .formulario h2 {
                font-size: 24px;
            }

            .descripcion {
                font-size: 15px;
                margin-bottom: 25px;
            }

            input,
            textarea {
                padding: 14px;
                font-size: 16px;
            }

            button {
                padding: 15px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="marca">
            <h1>🎫 Turno Fácil</h1>
            <p>Gestión de turnos sencilla y organizada</p>
        </div>

        <div class="formulario">

            <h2>Solicitar turno</h2>

            <p class="descripcion">
                Completa los datos para solicitar tu turno.
            </p>

            <form method="POST">

                {% csrf_token %}

                <label for="cliente">
                    Nombre del cliente
                </label>

                <input
                    type="text"
                    id="cliente"
                    name="cliente"
                    placeholder="Ej: Juan Pérez"
                    required
                >

                <label for="fecha">
                    Fecha y hora
                </label>

                <input
                    type="datetime-local"
                    id="fecha"
                    name="fecha"
                    required
                >

                <label for="necesidad">
                    ¿Qué necesitas?
                </label>

                <textarea
                    id="necesidad"
                    name="necesidad"
                    rows="4"
                    placeholder="Cuéntanos brevemente qué necesitas..."
                    required
                ></textarea>

                <button type="submit">
                    Solicitar turno
                </button>

            </form>

            <a class="volver" href="{% url 'inicio' %}">
                ← Volver al inicio
            </a>

        </div>

    </div>

</body>
</html>
